# Rendered by New-ReleasePipeline.ps1 from release.manifest.json.
# Do not edit this file. Edit the manifest and render it again.
name: 'Prompt Flipper release'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    name: Read the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Match the tag to the version source
        id: version
        env:
          TAG_PREFIX: 'v'
          VERSION_FILE: 'app/PromptFlipper.csproj'
          VERSION_PATTERN: '<Version>(?<version>[0-9]+\.[0-9]+\.[0-9]+)</Version>'
        run: |
          $match = [regex]::Match((Get-Content -Raw -LiteralPath $env:VERSION_FILE), $env:VERSION_PATTERN)
          if (-not $match.Success) { throw "No version match in $env:VERSION_FILE" }
          $version = $match.Groups['version'].Value
          $tagVersion = $env:GITHUB_REF_NAME.Substring($env:TAG_PREFIX.Length)
          if ($tagVersion -ne $version) {
              throw "Tag $env:GITHUB_REF_NAME does not match version $version in $env:VERSION_FILE"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    name: Build the release artifacts
    needs: prepare
    runs-on: 'windows-latest'
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 'Build the executable and the Store package'
        run: |
          $csproj = Get-Content -Raw -LiteralPath 'app/PromptFlipper.csproj'
          $match = [regex]::Match($csproj, '<StorePackageVersion>(?<v>[0-9]+\.[0-9]+\.[0-9]+\.0)</StorePackageVersion>')
          if (-not $match.Success) { throw 'No StorePackageVersion in app/PromptFlipper.csproj' }
          ./app/Build-PromptFlipperPackage.ps1 -StoreUpload -IdentityName 'RCKeller.PromptFlipper' -Publisher 'CN=D2F3AF1F-4EDD-4F12-88AA-035D5D68B4DF' -PublisherDisplayName 'RC Keller' -PackageVersion $match.Groups['v'].Value
      - name: 'Upload portable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'portable'
          path: 'app/publish/PromptFlipper.exe'
          if-no-files-found: error
      - name: 'Upload msix'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'msix'
          path: 'app/package-out/*_store.msix'
          if-no-files-found: error

  github-release:
    name: Create the GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ASSETS: 'portable,msix'
          RELEASE_TITLE: 'Prompt Flipper'
        run: |
          $files = foreach ($name in $env:RELEASE_ASSETS.Split(',')) {
              $found = @(Get-ChildItem -LiteralPath (Join-Path 'dist' $name) -File -Recurse)
              if ($found.Count -eq 0) { throw "Build artifact $name holds no files" }
              $found.FullName
          }
          gh release create $env:GITHUB_REF_NAME @files --title "$env:RELEASE_TITLE $env:RELEASE_VERSION" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited with $LASTEXITCODE" }

  msstore-msix:
    name: Submit the Microsoft Store update
    needs: [prepare, build, github-release]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download the MSIX package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: 'msix'
          path: msix
      - name: Check the package identity
        id: package
        env:
          PACKAGE_IDENTITY_NAME: 'RCKeller.PromptFlipper'
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'msix' -Filter '*.msix' -File -Recurse)
          if ($packages.Count -ne 1) { throw "Expected one .msix file in the package artifact, found $($packages.Count)" }
          $msix = $packages[0].FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix)
          try {
              $entry = $zip.GetEntry('AppxManifest.xml')
              if ($null -eq $entry) { throw "No AppxManifest.xml in $msix" }
              $reader = [System.IO.StreamReader]::new($entry.Open())
              try { [xml]$appx = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally {
              $zip.Dispose()
          }
          $identity = $appx.Package.Identity.Name
          if ($identity -cne $env:PACKAGE_IDENTITY_NAME) {
              throw "Package identity $identity does not match $env:PACKAGE_IDENTITY_NAME"
          }
          "path=$msix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install the Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
      - name: Configure the Partner Center credentials
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure exited with $LASTEXITCODE" }
      - name: Submit the package
        env:
          MSIX_PATH: ${{ steps.package.outputs.path }}
          STORE_PRODUCT_ID: '9PJSW6KZ5F63'
          STORE_NO_COMMIT: 'true'
        run: |
          $arguments = @('publish', (Split-Path -Parent $env:MSIX_PATH), '--inputFile', $env:MSIX_PATH, '--appId', $env:STORE_PRODUCT_ID)
          if ($env:STORE_NO_COMMIT -eq 'true') { $arguments += '--noCommit' }
          msstore @arguments
          if ($LASTEXITCODE -ne 0) { throw "msstore publish exited with $LASTEXITCODE" }
